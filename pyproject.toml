[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncp-olmo-eval"
version = "0.1.1"
description = "Reproducible vLLM evaluation for OLMo and NCP-ArchPreview"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "NCP-ArchPreview contributors"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "safetensors>=0.4.5",
  "huggingface-hub==0.36.2",
  "transformers==4.57.6",
]

[project.urls]
Repository = "https://github.com/LUMIA-Group/ncp_olmo_eval"
Issues = "https://github.com/LUMIA-Group/ncp_olmo_eval/issues"

[project.optional-dependencies]
vllm = [
  "torch==2.9.*",
  "vllm==0.13.0",
  "sympy==1.14.0",
  "antlr4-python3-runtime==4.11",
  "lm-eval==0.4.13",
]
gsm8k = [
  "sympy==1.14.0",
  "antlr4-python3-runtime==4.11",
  "lm-eval==0.4.13",
]
scoring = [
  "sympy==1.14.0",
  "antlr4-python3-runtime==4.11",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "ruff>=0.9",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=6.1",
]
helmet = [
  "datasets>=3.0",
  "nltk>=3.9",
  "openai>=1.60",
  "scikit-learn>=1.5",
]

[project.scripts]
ncp-olmo-eval = "ncp_olmo_eval.evaluation_cli:main"
ncp-olmo-eval-prepare = "ncp_olmo_eval.prepare_cli:main"
ncp-olmo-eval-task = "ncp_olmo_eval.task_runner:main"
ncp-olmo-eval-assets = "ncp_olmo_eval.assets:main"
ncp-olmo-eval-runtime-smoke = "ncp_olmo_eval.runtime_smoke:main"
ncp-olmo-eval-dflash-benchmark = "ncp_olmo_eval.ncp_dflash_vllm_benchmark:main"

[project.entry-points."vllm.general_plugins"]
ncp_olmo = "ncp_olmo_eval.vllm_plugin.plugin:register"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ncp_olmo_eval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
